# Deploy the develop SHA to dev: build once, publish, deploy (CI-DEPLOY-*). Start it by hand
# on develop: gh workflow run deploy.yml --ref develop
# build publishes the widget host image ghcr.io/velimirmueller/synthwerk-widgets:<sha>. Its build
# downloads every version in releases.json from its GitHub Release (release.yml) and checks it
# against the recorded integrity (Dockerfile, SOURCE=release). synthwerk-infra pins the image by
# digest and routes /widgets/ on the edge. deploy-dev deploys nothing: the edge has no dev host yet.
name: deploy
run-name: deploy · dev · ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - name: Resolve the environment from the ref
        id: resolve
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/develop" ] || { echo "::error::deploy-dev runs only on develop"; exit 1; }
          echo "env=dev" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      checks: read
      pull-requests: read
      id-token: write # the sign job of _build-publish.yml (cosign keyless); GitHub checks it at startup
    uses: VelimirMueller/fleet-workflows/.github/workflows/_build-publish.yml@v0.0.4
    with:
      # Image only: the image build fetches the released bundles; nothing is built on the runner.
      stack: none
      image: true

  deploy-dev:
    needs: [setup, build]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_deploy-run.yml@v0.0.4
    with:
      environment: ${{ needs.setup.outputs.env }}
      github-environment: dev
      # No deploy command and no health URL yet: the edge is not on the dev host (synthwerk-infra).
