# Widget host (widgets#32): every released bundle under /widgets/v<X.Y.Z>/<file>, and nothing else.
# The bytes behind a path never change, so the answer may be cached for a year (immutable).
# A module script with integrity loads cross-origin only with the CORS header.
# Runs as uid 101 on a read-only root; nginx writes only to /tmp (pid and temp files).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # Container health for compose; the commit comes from the image build (Dockerfile).
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","commit":"@COMMIT@"}\n';
    }

    location ~ "^/widgets/v[0-9]+\.[0-9]+\.[0-9]+/synthwerk-(chat|vision)\.js$" {
        # GET includes HEAD; every other method gets 403.
        limit_except GET {
            deny all;
        }
        types { }
        default_type text/javascript;
        # Without "always": a 404 (unknown version) gets none of these headers, so no cache header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # add_header in a location drops every server-level add_header: repeat shared headers here.
    # The chat frame page of <synthwerk-chat mode="iframe"> (widgets#33). Any site may frame it
    # (frame-ancestors *): it accepts messages only from the parent origin in its URL and only a
    # widget token bound to that origin. Same strict CSP as the widgets: no inline code, no eval;
    # it calls only its own origin (the edge, where llm is).
    location ~ "^/widgets/v[0-9]+\.[0-9]+\.[0-9]+/synthwerk-chat-frame\.html$" {
        limit_except GET {
            deny all;
        }
        types { }
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors *";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Referrer-Policy "no-referrer";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
